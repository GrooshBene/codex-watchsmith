name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests
      - run: python3 -m compileall -q bin scripts tests
      - run: zsh -o NO_BG_NICE -n install.sh uninstall.sh bin/watchsmith bin/codex-watch bin/activitysmith-keychain-setup bin/activitysmith-test
      - run: git diff --check
