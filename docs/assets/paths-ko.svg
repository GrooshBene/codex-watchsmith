<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc"><title id="title">Notification responsibilities</title><desc id="desc">Agent progress, CLI timing fallback, and completion events have separate responsibilities.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1200" height="290" rx="24" fill="#f2f5f9" stroke="none"/><text x="36" y="44" font-size="18" fill="#35455d" font-weight="700">작업의 각 순간을 담당하는 세 가지 알림 경로</text><rect x="36" y="69" width="360" height="185" rx="16" fill="#ffffff" stroke="#d9e1ed"/><text x="58" y="103" font-size="15" fill="#126952" font-weight="700">01</text><text x="58" y="141" font-size="25" fill="#15263d" font-weight="700">에이전트 → MCP</text><text x="58" y="184" font-size="20" fill="#35455d" font-weight="400">지금 무엇을 하고 있나요?</text><text x="58" y="222" font-size="17" fill="#126952" font-weight="400">작업 맥락에 맞는 진행 상황</text><rect x="420" y="69" width="360" height="185" rx="16" fill="#ffffff" stroke="#d9e1ed"/><text x="442" y="103" font-size="15" fill="#886020" font-weight="700">02</text><text x="442" y="141" font-size="25" fill="#15263d" font-weight="700">CLI watchdog</text><text x="442" y="184" font-size="20" fill="#35455d" font-weight="400">아직 실행 중인가요?</text><text x="442" y="222" font-size="17" fill="#886020" font-weight="400">시간 기준 CLI 보조 알림</text><rect x="804" y="69" width="360" height="185" rx="16" fill="#ffffff" stroke="#d9e1ed"/><text x="826" y="103" font-size="15" fill="#315db1" font-weight="700">03</text><text x="826" y="141" font-size="25" fill="#15263d" font-weight="700">완료 hook</text><text x="826" y="184" font-size="20" fill="#35455d" font-weight="400">어떤 결과가 나왔나요?</text><text x="826" y="222" font-size="17" fill="#315db1" font-weight="400">요청과 처리 결과 요약</text></g></svg>