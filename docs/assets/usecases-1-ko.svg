<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Watchsmith notification use cases</title><desc id="desc">Illustrative notification examples, not device screenshots. Sample values are not live measurements.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1200" height="390" rx="24" fill="#0b1220" stroke="none"/><text x="32" y="43" font-size="16" fill="#a7b5ca" font-weight="600">01 / 코드 수정</text><rect x="32" y="65" width="552" height="257" rx="20" fill="#172234" stroke="#344257"/><text x="56" y="98" font-size="12" fill="#78dfc3" font-weight="700">SEGMENTED PROGRESS</text><text x="56" y="139" font-size="26" fill="#f4f7fc" font-weight="650">로그인 흐름 수정 중</text><text x="56" y="178" font-size="19" fill="#b9cbd5" font-weight="400">3단계 중 2단계 · 세션 처리 수정</text><rect x="56" y="210" width="157" height="9" rx="4" fill="#78dfc3" stroke="none"/><rect x="225" y="210" width="157" height="9" rx="4" fill="#78dfc3" stroke="none"/><rect x="394" y="210" width="157" height="9" rx="4" fill="#344257" stroke="none"/><text x="56" y="271" font-size="19" fill="#78dfc3" font-weight="400">재현 → 수정 → 검증</text><text x="616" y="43" font-size="16" fill="#a7b5ca" font-weight="600">02 / 테스트 실행</text><rect x="616" y="65" width="552" height="257" rx="20" fill="#172234" stroke="#344257"/><text x="640" y="98" font-size="12" fill="#78dfc3" font-weight="700">PROGRESS</text><text x="640" y="139" font-size="26" fill="#f4f7fc" font-weight="650">회귀 테스트 실행 중</text><text x="640" y="178" font-size="19" fill="#b9cbd5" font-weight="400">테스트 24개 중 18개 처리 완료</text><rect x="640" y="211" width="500" height="10" rx="5" fill="#344257" stroke="none"/><rect x="640" y="211" width="375" height="10" rx="5" fill="#78dfc3" stroke="none"/><text x="640" y="278" font-size="34" fill="#78dfc3" font-weight="700">75%</text><text x="32" y="362" font-size="15" fill="#8597af" font-weight="400">설명용 예시 · 문구와 수치는 예시이며 실제 표시와 다를 수 있습니다</text></g></svg>