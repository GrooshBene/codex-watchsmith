<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Watchsmith notification use cases</title><desc id="desc">Illustrative notification examples, not device screenshots. Sample values are not live measurements.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1200" height="390" rx="24" fill="#0b1220" stroke="none"/><text x="32" y="43" font-size="16" fill="#a7b5ca" font-weight="600">03 / 원인 조사</text><rect x="32" y="65" width="552" height="257" rx="20" fill="#172234" stroke="#344257"/><text x="56" y="98" font-size="12" fill="#78dfc3" font-weight="700">TIMER</text><text x="56" y="139" font-size="26" fill="#f4f7fc" font-weight="650">빌드 지연 원인 조사 중</text><text x="56" y="178" font-size="19" fill="#b9cbd5" font-weight="400">의존성 처리와 빌드 로그 비교 중</text><text x="56" y="268" font-size="40" fill="#78dfc3" font-weight="600">4분 경과</text><text x="616" y="43" font-size="16" fill="#a7b5ca" font-weight="600">04 / 문제 발생</text><rect x="616" y="65" width="552" height="257" rx="20" fill="#172234" stroke="#344257"/><text x="640" y="98" font-size="12" fill="#f3bd6e" font-weight="700">ALERT</text><text x="640" y="139" font-size="26" fill="#f4f7fc" font-weight="650">의존성 설치가 중단됨</text><text x="640" y="178" font-size="19" fill="#b9cbd5" font-weight="400">패키지 저장소에 연결하지 못했습니다.</text><text x="640" y="264" font-size="21" fill="#f3bd6e" font-weight="600">!  배포는 아직 시작하지 않았습니다.</text><text x="32" y="362" font-size="15" fill="#8597af" font-weight="400">설명용 예시 · 문구와 수치는 예시이며 실제 표시와 다를 수 있습니다</text></g></svg>