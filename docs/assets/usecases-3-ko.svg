<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Watchsmith notification use cases</title><desc id="desc">Illustrative notification examples, not device screenshots. Sample values are not live measurements.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1200" height="390" rx="24" fill="#0b1220" stroke="none"/><text x="32" y="43" font-size="16" fill="#a7b5ca" font-weight="600">05 / 측정 결과</text><rect x="32" y="65" width="552" height="257" rx="20" fill="#172234" stroke="#344257"/><text x="56" y="98" font-size="12" fill="#78dfc3" font-weight="700">METRICS</text><text x="56" y="139" font-size="26" fill="#f4f7fc" font-weight="650">설치 상태 점검 중</text><text x="56" y="178" font-size="19" fill="#b9cbd5" font-weight="400">검증 파일 / 설정 오류</text><text x="56" y="270" font-size="44" fill="#78dfc3" font-weight="700">13</text><text x="125" y="268" font-size="17" fill="#b9cbd5" font-weight="400">개 파일 검증</text><text x="322" y="270" font-size="44" fill="#78dfc3" font-weight="700">0</text><text x="363" y="268" font-size="17" fill="#b9cbd5" font-weight="400">개 설정 오류</text><text x="616" y="43" font-size="16" fill="#a7b5ca" font-weight="600">06 / 작업 종료</text><rect x="616" y="65" width="552" height="257" rx="20" fill="#172234" stroke="#344257"/><text x="640" y="98" font-size="12" fill="#91b8ff" font-weight="700">COMPLETION PUSH</text><text x="640" y="139" font-size="26" fill="#f4f7fc" font-weight="650">로그인 오류 수정 · 작업 결과</text><text x="640" y="178" font-size="19" fill="#b9cbd5" font-weight="400">로그인 후 세션 갱신 오류를 수정했습니다.</text><text x="640" y="237" font-size="19" fill="#91b8ff" font-weight="600">테스트 24개 통과. 배포는 미진행.</text><text x="32" y="362" font-size="15" fill="#8597af" font-weight="400">설명용 예시 · 문구와 수치는 예시이며 실제 표시와 다를 수 있습니다</text></g></svg>