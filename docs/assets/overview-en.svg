<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Watchsmith workflow</title><desc id="desc">A Codex task on a Mac followed by progress and completion notifications on an iPhone.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1200" height="630" rx="28" fill="#0b1220" stroke="none"/><text x="56" y="59" font-size="17" fill="#78dfc3" font-weight="700">WATCHSMITH</text><text x="56" y="119" font-size="40" fill="#f4f7fc" font-weight="700">Your task is moving. So can you.</text><text x="56" y="158" font-size="21" fill="#a7b5ca" font-weight="400">Codex on your Mac. Progress and results on your iPhone.</text><text x="66" y="225" font-size="15" fill="#a7b5ca" font-weight="600">01  /  START ON YOUR MAC</text><rect x="56" y="249" width="443" height="265" rx="16" fill="#172234" stroke="#344257"/><circle cx="81" cy="274" r="5" fill="#ff8f8f"/><circle cx="102" cy="274" r="5" fill="#f3d18c"/><circle cx="123" cy="274" r="5" fill="#78dfc3"/><text x="80" y="322" font-size="23" fill="#f4f7fc" font-weight="600">Codex</text><text x="80" y="364" font-size="19" fill="#e8eef7" font-weight="400">Run the tests and fix the failures.</text><rect x="80" y="393" width="392" height="85" rx="10" fill="#0e1726" stroke="none"/><text x="98" y="422" font-size="17" fill="#78dfc3" font-weight="400">Working through the test suite…</text><rect x="99" y="440" width="285" height="5" rx="2" fill="#2a3b52" stroke="none"/><rect x="99" y="455" width="219" height="5" rx="2" fill="#2a3b52" stroke="none"/><path d="M 527 380 H 577 M 566 369 L 578 380 L 566 391" fill="none" stroke="#78dfc3" stroke-width="3" stroke-linecap="round"/><text x="612" y="225" font-size="15" fill="#a7b5ca" font-weight="600">02  /  FOLLOW ON YOUR IPHONE</text><rect x="602" y="249" width="542" height="128" rx="18" fill="#172c36" stroke="#31514f"/><text x="626" y="281" font-size="12" fill="#78dfc3" font-weight="700">LIVE ACTIVITY</text><text x="626" y="315" font-size="23" fill="#f4f7fc" font-weight="600">Checking the test suite</text><text x="626" y="347" font-size="17" fill="#b9cbd5" font-weight="400">Step 2 of 3 · Validation</text><rect x="980" y="336" width="34" height="7" rx="3" fill="#78dfc3" stroke="none"/><rect x="1024" y="336" width="34" height="7" rx="3" fill="#78dfc3" stroke="none"/><rect x="1068" y="336" width="34" height="7" rx="3" fill="#365052" stroke="none"/><rect x="602" y="395" width="542" height="145" rx="18" fill="#172234" stroke="#344257"/><text x="626" y="428" font-size="12" fill="#91b8ff" font-weight="700">COMPLETION PUSH</text><text x="626" y="465" font-size="23" fill="#f4f7fc" font-weight="600">Test fixes · Task result</text><text x="626" y="498" font-size="18" fill="#b9cbd5" font-weight="400">Fixed the parser. All 12 tests passed.</text><text x="56" y="589" font-size="15" fill="#8597af" font-weight="400">Illustrative workflow · Example content, not an app screenshot</text></g></svg>